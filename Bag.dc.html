      return {
        page: p.page, img: p.img, alt: p.alt, name: p.name, qty: x.qty,
        price: PR[x.id] !== undefined ? '$' + (PR[x.id] * x.qty).toLocaleString('en-US') : '[PRICE]',
        priced: PR[x.id] !== undefined, amount: (PR[x.id] || 0) * x.qty,
        meta: (p.cat) + (x.size ? ' \u00b7 Size ' + x.size : ''),
        inc: () => { const l = this.readItems(); l[i].qty += 1; setItems(l); },
        dec: () => { const l = this.readItems(); l[i].qty -= 1; setItems(l.filter((y) => y.qty > 0)); },
        remove: () => { const l = this.readItems(); l.splice(i, 1); setItems(l); }
      };
    });
    return {
      items: items,
      count: items.reduce((a, x) => a + x.qty, 0),
      subtotal: items.every((x) => x.priced) ? '$' + items.reduce((a, x) => a + x.amount, 0).toLocaleString('en-US') : '[PRICE]',
      empty: items.length === 0,
      hasItems: items.length > 0,
      showZone: !zone || !!(this.state && this.state.choosing),
      hasZone: !!zone,
      zoneName: zone ? zdefs[zone].name : '',
      openZone: () => this.setState({ choosing: true }),
      zones: zones,
      bag: bag,
      add: add,
      c: { zoneLabel: this.coordsLabel() + ' \u2014 ', air: c.air, uv: c.uv, uvLabel: c.uvLabel, rain: c.rain, hours: c.hours, essential: top.short, essentialHref: top.href },
      products: products
    };
  }
}
</script>
</body>
</html>
