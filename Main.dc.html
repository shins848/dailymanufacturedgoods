    return this.readItems().reduce((a, x) => a + (x.qty || 0), 0);

  addItem(id, size) {
    const list = this.readItems();
    const hit = list.find((x) => x.id === id && (x.size || '') === (size || ''));
    if (hit) hit.qty += 1; else list.push({ id: id, size: size || '', qty: 1 });
    this.writeItems(list);
    this.setState({ bag: this.readBag(), items: list });
  }
  coordsLabel() {
    let rid = '';

    this._onVis = () => { if (document.visibilityState === 'hidden') this._muteAll(); else this._restart(); };
    this._onShow = () => this._restart();

    window.addEventListener('pagehide', this._muteAll);
    window.addEventListener('pageshow', this._onShow);
    this._away = false;
    if (v && window.IntersectionObserver) { this._io = new IntersectionObserver((es) => { es.forEach((en) => { if (!en.isIntersecting) { this._away = true; this._muteAll(); } else if (this._away) { this._away = false; this._restart(); } }); }, { threshold: 0 }); this._io.observe(v); }
    this.setState({ bag: this.readBag() });
    this.setState({ zone: this.readZone() });

    window.addEventListener('focus', this._sync);
  }
  componentWillUnmount() {
    if (this._tick) clearInterval(this._tick);

    window.removeEventListener('pagehide', this._muteAll);
    window.removeEventListener('pageshow', this._onShow);
    if (this._io) this._io.disconnect();
    window.removeEventListener('storage', this._sync);
    window.removeEventListener('focus', this._sync);
  }

    const s = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    let seed = 7;
    for (let i = 0; i < s.length; i++) seed = (seed * 131 + s.charCodeAt(i)) % 2147483647;
    const rnd = () => { seed = (seed * 48271) % 2147483647; return seed / 2147483647; };
    rnd(); rnd(); rnd();
    const r1 = rnd(), r2 = rnd(), r3 = rnd();
    const zd = this.zoneDefs()[this.readZone()];
    const air = zd ? Math.round(zd.air[0] + r1 * zd.air[1]) : Math.round(40 + r1 * 200);
    const uv = zd ? Math.round(zd.uv[0] + r2 * zd.uv[1]) : Math.round(2 + r2 * 10);
    const rain = zd ? Math.round((zd.rain[0] + r3 * zd.rain[1]) / 10) * 10 : Math.round(r3 * 9) * 10;
    const uvLabel = uv >= 11 ? 'Extreme' : uv >= 8 ? 'Very high' : uv >= 6 ? 'High' : uv >= 3 ? 'Moderate' : 'Low';
    const threat = { uv: uv / 11, air: air / 200, rain: rain / 80 };
    const worst = Math.max(threat.uv, threat.air, threat.rain);
    const mins = Math.max(30, Math.round((6 - 4.5 * worst) * 2) * 30);
    const hours = mins < 60 ? mins + ' min' : (mins / 60) + (mins === 60 ? ' hr' : ' hrs');
    return { air, uv, rain, uvLabel, threat, hours, mins };
  }
  renderVals() {
    const bag = (this.state && this.state.bag) || 0;
    const add = () => {};
    const c = this.conditions();
    const score = (p) => p.w.uv * c.threat.uv + p.w.air * c.threat.air + p.w.rain * c.threat.rain;
    const all = this.catalog().map((p) => ({ ...p, score: score(p) })).sort((a, b) => b.score - a.score);
    const top = all[0];
    const page = '';
    const catOrder = ['Equipment', 'Self-Care', 'Protective Gear'];
    const list = page === 'All'
      ? all.slice().sort((a, b) => (catOrder.indexOf(a.cat) - catOrder.indexOf(b.cat)) || (b.score - a.score))
      : all.filter((p) => p.cat === page);
    const products = list.map((p, i) => ({ ...p, price: '[PRICE]', today: (page === 'All' ? p.id === top.id : i === 0) && p.score > 0.6, add: () => this.addItem(p.id, '') }));
    const zone = (this.state && this.state.zone !== undefined) ? this.state.zone : this.readZone();
    const zdefs = this.zoneDefs();
    const zones = Object.keys(zdefs).map((k) => ({ name: zdefs[k].name, note: zdefs[k].note, border: k === zone ? '#141516' : '#E4E5E5', pick: () => { this.writeZone(k); this.setState({ zone: k, choosing: false }); } }));
    const now = new Date();
    const Mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let ws = 11; const ds = now.getFullYear() + '/' + now.getMonth() + '/' + now.getDate();
    for (let i = 0; i < ds.length; i++) ws = (ws * 131 + ds.charCodeAt(i)) % 2147483647;
    const wr = () => { ws = (ws * 48271) % 2147483647; return ws / 2147483647; };
    wr(); const hum = Math.round(28 + wr() * 60), wind = Math.round(4 + wr() * 38);
    const wPhase = wr() * 6.28;
    const temp = Math.max(-31, Math.min(54, Math.round(12 + 34 * Math.sin(wPhase) + (wr() - 0.5) * 10)));
    let rid = '';
    try { rid = window.localStorage.getItem('dmg-resident') || ''; if (!rid) { rid = String(1000 + Math.floor(Math.random() * 9000)); window.localStorage.setItem('dmg-resident', rid); } } catch (e) { rid = '0417'; }
    const rn = parseInt(rid, 10) || 417;
    const lat = (20 + (rn * 7919 % 4000) / 100).toFixed(4), lon = (100 + (rn * 104729 % 4500) / 100).toFixed(4);
    const worstT = Math.max(c.threat.uv, c.threat.air, c.threat.rain, Math.abs(temp - 18) / 30);
    const t = {
      date: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()] + ' ' + Mo[now.getMonth()] + ' ' + now.getDate(),
      coords: lat + '\u00b0 N, ' + lon + '\u00b0 E',
      temp: temp, hum: hum, wind: wind,
      status: worstT > 0.85 ? 'Stay indoors' : worstT > 0.55 ? 'Limit exposure' : 'Conditions tolerable'
    };
    const soundOn = !!(this.state && this.state.soundOn);
    const films = this.films(); const vidIdx = ((this.state && this.state.vidIdx) || 0) % films.length;
    const pad = (n) => (n < 10 ? '0' : '') + n;
    return {
      vid: films[vidIdx],
      vidCount: pad(vidIdx + 1) + ' / ' + pad(films.length),
      clockDate: (() => { const n = new Date(); const D = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; const M = ['January','February','March','April','May','June','July','August','September','October','November','December']; return D[n.getDay()] + ', ' + M[n.getMonth()] + ' ' + n.getDate() + ', ' + n.getFullYear(); })(),
      clockTime: (() => { const n = new Date(); const p = (x) => (x < 10 ? '0' : '') + x; return p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds()); })(),
      toggleVid: () => { const v = this.bgVideo(); if (!v) return; if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else { v.pause(); } },
      prevVid: () => this.goVid(-1),
      nextVid: () => this.goVid(1),
      soundOn: soundOn ? 'true' : 'false',
      soundLabel: soundOn ? 'Mute' : 'Unmute',
      isMuted: !soundOn,
      isOn: soundOn,
      toggleSound: () => {
        const v = this.bgVideo(); const on = !soundOn;
        if (v) { v.muted = !on; if (on) { v.volume = 1; const p = v.play(); if (p && p.catch) p.catch(() => {}); } }
        this.setState({ soundOn: on });
      },
      t: t,
      showZone: !zone || !!(this.state && this.state.choosing),
      hasZone: !!zone,
      zoneName: zone ? zdefs[zone].name : '',
      openZone: () => this.setState({ choosing: true }),
      zones: zones,
      bag: bag,
      add: add,
      c: { zoneLabel: this.coordsLabel() + ' \u2014 ', air: c.air, uv: c.uv, uvLabel: c.uvLabel, rain: c.rain, hours: c.hours, essential: top.short, essentialHref: top.href },
      products: products
    };
  }
}
